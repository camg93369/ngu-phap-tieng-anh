<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mặc Hiên Thi Viện - Luyện Thi Tiếng Anh</title>
    <style>
        :root {
            --primary: #8b5cf6;
            --primary-hover: #7c3aed;
            --bg: #f3f4f6;
            --card-bg: #ffffff;
            --text: #1f2937;
            --border: #e5e7eb;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 800px;
            background: var(--card-bg);
            padding: 24px;
            border-radius: 16px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--border);
            padding-bottom: 16px;
            margin-bottom: 20px;
        }

        h1 {
            margin: 0;
            color: var(--primary);
            font-size: 1.5rem;
        }

        .btn {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: background 0.2s;
        }

        .btn:hover {
            background-color: var(--primary-hover);
        }

        .btn-ai {
            background-color: #059669;
        }
        .btn-ai:hover {
            background-color: #047857;
        }

        .topic-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 12px;
            margin-bottom: 20px;
        }

        .topic-card {
            border: 1px solid var(--border);
            padding: 12px;
            border-radius: 8px;
            cursor: pointer;
            text-align: center;
            transition: all 0.2s;
        }

        .topic-card:hover {
            border-color: var(--primary);
            background-color: #f5f3ff;
        }

        .quiz-container {
            display: none;
        }

        .options-list {
            list-style: none;
            padding: 0;
        }

        .option-item {
            border: 1px solid var(--border);
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 8px;
            cursor: pointer;
        }

        .option-item:hover {
            background-color: #f9fafb;
        }

        .option-item.correct {
            background-color: #d1fae5;
            border-color: #10b981;
        }

        .option-item.wrong {
            background-color: #fee2e2;
            border-color: #ef4444;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background: white;
            padding: 24px;
            border-radius: 12px;
            width: 90%;
            max-width: 400px;
        }

        .input-text {
            width: 100%;
            padding: 8px;
            margin: 12px 0;
            box-sizing: border-box;
        }

        #notification {
            padding: 10px;
            margin-bottom: 10px;
            border-radius: 6px;
            background: #e0f2fe;
            color: #0369a1;
            display: none;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>📜 Mặc Hiên Thi Viện</h1>
        <button class="btn" onclick="openApiKeyModal()">🔑 Bí Kíp (API Key)</button>
    </header>

    <div id="notification"></div>

    <!-- Danh sách chủ đề -->
    <div id="topic-section">
        <h3>Chọn Trường Thi Ngữ Pháp:</h3>
        <div class="topic-grid" id="topic-grid"></div>
    </div>

    <!-- Khu vực làm bài -->
    <div id="quiz-section" class="quiz-container">
        <button class="btn" onclick="backToTopics()">⬅ Trở về danh sách</button>
        <button class="btn btn-ai" onclick="generateAIQuiz()">✨ AI Ra Đề Mới</button>
        
        <h3 id="quiz-topic-title"></h3>
        <div id="question-text" style="font-size: 1.1rem; margin: 16px 0;"></div>
        <ul class="options-list" id="options-list"></ul>
        <div id="explanation" style="margin-top: 12px; font-style: italic; color: #4b5563;"></div>
    </div>
</div>

<!-- Modal Nhập API Key -->
<div id="api-modal" class="modal">
    <div class="modal-content">
        <h3>Nhập Google Gemini API Key</h3>
        <input type="text" id="api-key-input" class="input-text" placeholder="Dán API Key vào đây...">
        <div style="display: flex; justify-content: flex-end; gap: 8px;">
            <button class="btn" style="background:#6b7280" onclick="closeApiKeyModal()">Hủy</button>
            <button class="btn" onclick="saveApiKey()">Lưu</button>
        </div>
    </div>
</div>

<script>
    // Dữ liệu mặc định
    const defaultTopics = [
        {
            id: 'tenses',
            name: 'Các Thì Trong Tiếng Anh',
            questions: [
                {
                    q: "She ______ to school every day.",
                    options: ["go", "goes", "went", "going"],
                    answer: 1,
                    explanation: "Chủ ngữ 'She' đi với động từ thêm -s/-es ở thì hiện tại đơn."
                }
            ]
        },
        {
            id: 'passive',
            name: 'Câu Bị Động (Passive Voice)',
            questions: [
                {
                    q: "The letter ______ sent yesterday.",
                    options: ["is", "was", "were", "been"],
                    answer: 1,
                    explanation: "Chủ ngữ số ít 'The letter' kết hợp trạng từ 'yesterday' dùng 'was'."
                }
            ]
        }
    ];

    let userData = {
        apiKey: localStorage.getItem('gemini_api_key') || ''
    };

    let currentTopic = null;
    let currentQuestions = [];
    let currentQIndex = 0;

    // Khởi tạo giao diện
    function init() {
        renderTopics();
    }

    function MặcHiênThôngBáo(msg) {
        const noti = document.getElementById('notification');
        noti.innerText = msg;
        noti.style.display = 'block';
        setTimeout(() => { noti.style.display = 'none'; }, 4000);
    }

    function renderTopics() {
        const grid = document.getElementById('topic-grid');
        grid.innerHTML = '';
        defaultTopics.forEach(topic => {
            const card = document.createElement('div');
            card.className = 'topic-card';
            card.innerHTML = `<strong>${topic.name}</strong><br><small>${topic.questions.length} câu hỏi</small>`;
            card.onclick = () => startQuiz(topic);
            grid.appendChild(card);
        });
    }

    function startQuiz(topic) {
        currentTopic = topic;
        currentQuestions = [...topic.questions];
        currentQIndex = 0;
        
        document.getElementById('topic-section').style.display = 'none';
        document.getElementById('quiz-section').style.display = 'block';
        document.getElementById('quiz-topic-title').innerText = topic.name;
        
        loadQuestion();
    }

    function backToTopics() {
        document.getElementById('quiz-section').style.display = 'none';
        document.getElementById('topic-section').style.display = 'block';
    }

    function loadQuestion() {
        if (currentQuestions.length === 0) return;
        const q = currentQuestions[currentQIndex];
        document.getElementById('question-text').innerText = `Câu ${currentQIndex + 1}: ${q.q}`;
        document.getElementById('explanation').innerText = '';
        
        const list = document.getElementById('options-list');
        list.innerHTML = '';
        
        q.options.forEach((opt, idx) => {
            const li = document.createElement('li');
            li.className = 'option-item';
            li.innerText = opt;
            li.onclick = () => checkAnswer(idx, q.answer, q.explanation, li);
            list.appendChild(li);
        });
    }

    function checkAnswer(selected, correct, exp, element) {
        const items = document.querySelectorAll('.option-item');
        items.forEach(item => item.style.pointerEvents = 'none');
        
        if (selected === correct) {
            element.classList.add('correct');
        } else {
            element.classList.add('wrong');
            items[correct].classList.add('correct');
        }
        
        document.getElementById('explanation').innerText = `Giải thích: ${exp}`;
    }

    // Xử lý API Key
    function openApiKeyModal() {
        document.getElementById('api-key-input').value = userData.apiKey;
        document.getElementById('api-modal').style.display = 'flex';
    }

    function closeApiKeyModal() {
        document.getElementById('api-modal').style.display = 'none';
    }

    function saveApiKey() {
        const key = document.getElementById('api-key-input').value.trim();
        userData.apiKey = key;
        localStorage.setItem('gemini_api_key', key);
        closeApiKeyModal();
        MặcHiênThôngBáo("Đã lưu Bí Kíp thành công!");
    }

    // TÍNH NĂNG GỌI API GEMINI (ĐÃ TỐI ƯU & SỬA LỖI CÚ PHÁP)
    window.generateAIQuiz = async function() {
        if (!userData.apiKey) {
            MặcHiênThôngBáo("Chưa có Bí Kíp! Hãy vào bấm '🔑 Bí Kíp' để nhập API Key của bạn.");
            openApiKeyModal();
            return;
        }
        
        MặcHiênThôngBáo("Mặc Hiên tiên sinh đang suy ngẫm để vận công ra đề mới...");
        
        try {
            const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${userData.apiKey}`;
            const randomSeed = Date.now();
            const promptText = `Bạn là Mặc Hiên tiên sinh, một thầy giáo dạy tiếng Anh giỏi. 
Hãy sáng tạo 1 câu hỏi trắc nghiệm tiếng Anh hoàn toàn MỚI và ĐỘC ĐÁO (mã ngẫu nhiên: ${randomSeed}) về chủ đề: "${currentTopic.name}".

YÊU CẦU BẮT BUỘC:
- Chỉ trả về duy nhất 1 chuỗi JSON hợp lệ.
- Không sử dụng Markdown format (không ghi \`\`\`json).
- Cấu trúc JSON phải chính xác như sau:
{
  "q": "Nội dung câu hỏi tiếng Anh?",
  "options": ["Đáp án A", "Đáp án B", "Đáp án C", "Đáp án D"],
  "answer": 0,
  "explanation": "Giải thích chi tiết lý do chọn đáp án bằng tiếng Việt"
}`;

            const response = await fetch(apiUrl, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    contents: [{ parts: [{ text: promptText }] }],
                    generationConfig: { temperature: 0.9 }
                })
            });

            if (!response.ok) {
                const errData = await response.json();
                throw new Error(`Mã lỗi ${response.status}: ${errData.error?.message || 'Không thể kết nối API'}`);
            }

            const data = await response.json();
            let textRes = data.candidates[0].content.parts[0].text;
            
            textRes = textRes.replace(/```json/gi, '').replace(/```/g, '').trim();
            const aiQuestion = JSON.parse(textRes);

            if (!aiQuestion.q || !Array.isArray(aiQuestion.options) || aiQuestion.options.length !== 4) {
                throw new Error("Dữ liệu câu hỏi từ AI không đúng định dạng!");
            }

            currentQuestions.push(aiQuestion);
            currentTopic.questions = [...currentQuestions];
            currentQIndex = currentQuestions.length - 1;
            
            MặcHiênThôngBáo("Mặc Hiên tiên sinh đã hoàn thành đề thi mới!");
            loadQuestion();

        } catch (e) {
            console.error("Lỗi API Chi Tiết:", e);
            MặcHiênThôngBáo(`Lỗi ra đề: ${e.message}`);
        }
    }

    // Chạy ứng dụng
    init();
</script>
</body>
</html>
